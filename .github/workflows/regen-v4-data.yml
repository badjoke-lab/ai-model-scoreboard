# Purpose: Regenerate v4 public snapshot data and open a data-only PR.
# Manual run only: GitHub Actions -> this workflow -> Run workflow (no local steps).
# Safety: Must NOT include code changes; guard fails on non-public/data/v4 paths.
# Success looks like: branch/PR named chore/regenerate-v4-snapshot with updated v4 artifacts.
name: Regenerate v4 public snapshot data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate v4 public data
        run: |
          cd engine
          npm ci
          npm run snapshot
          cd ..
          mkdir -p public/data/v4
          rsync -a --delete engine/output/v4/ public/data/v4/
          npm run v4:verify

      - name: Run spec gate
        run: npm run spec:v4

      - name: Run build gate
        run: npm run build

      - name: Ensure only public/data/v4 changes
        id: verify_changes
        run: |
          changed="$(git diff --name-only --diff-filter=ACMRT HEAD)"
          echo "$changed" | sed '/^\s*$/d' > /tmp/changed.txt
          echo "Changed files (post-generation):"
          if [ -s /tmp/changed.txt ]; then
            cat /tmp/changed.txt
          else
            echo "(none)"
          fi
          if [ -s /tmp/changed.txt ]; then
            if grep -qv '^public/data/v4/' /tmp/changed.txt; then
              echo "ERROR: Non-v4 files changed:"
              grep -v '^public/data/v4/' /tmp/changed.txt
              echo "Guard result: FAIL"
              exit 1
            fi
            echo "Guard result: PASS (only public/data/v4/** changes)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No v4 data changes detected; skipping PR."
          echo "Guard result: PASS (no changes)"
          echo "has_changes=false" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.verify_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/regenerate-v4-snapshot
          title: "chore(v4): regenerate public snapshot"
          body: |
            ## Summary
            - Regenerated public v4 snapshot artifacts via workflow.
            - spec:v4 and build passed in workflow logs.
          add-paths: |
            public/data/v4
