name: Validate v4 snapshot

on:
  pull_request:
    paths:
      - "public/data/v4/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate v4 snapshot
        run: node scripts/validate_v4_snapshot.mjs
